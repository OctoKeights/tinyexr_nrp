[package]
name = "tinyexr_nrp"
description = "OpenEXR files read and written in pure, safe Rust: a native port of tinyexr, bit-identical to it, with DWAA and DWAB as OpenEXR has them."
version = "0.3.0"
edition = "2024"
rust-version = "1.100"
license = "BSD-3-Clause"
repository = "https://github.com/OctoKeights/tinyexr_nrp"
readme = "README.md"
keywords = ["exr", "openexr", "hdr", "image", "tinyexr"]
categories = ["multimedia::images", "encoding"]

[dependencies]
miniz_nrp = { version = "0.2.0", git = "https://github.com/OctoKeights/miniz_nrp" }
zfp_nrp = { version = "0.2.0", git = "https://github.com/OctoKeights/zfp_nrp" }
openexr_nrp = { version = "0.2.0", git = "https://github.com/OctoKeights/openexr_nrp" }

[lints.rust]
# No unsafe code in the library, its tests, examples or benchmarks.
unsafe_code = "forbid"
missing_docs = "warn"

[lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Integer and float conversions that narrow or reinterpret are the codec's arithmetic, as they
# are in the original's C; each is deliberate, so these four are not flagged.
cast_possible_truncation = "allow"
cast_possible_wrap = "allow"
cast_precision_loss = "allow"
cast_sign_loss = "allow"
# Flags clear pairs of names such as max_ac and max_dc, or runs and rune.
similar_names = "allow"
